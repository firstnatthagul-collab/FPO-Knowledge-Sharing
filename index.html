<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPO Knowledge Sharing | ศูนย์รวม e-Book ฟรี</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            300: '#fde047',
                            400: '#eab308',
                            500: '#ca8a04',
                            600: '#a16207',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-gradient-bg {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
        }
        .glass-header {
            background: rgba(3, 7, 18, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <header class="glass-header text-white sticky top-0 z-50 border-b border-amber-500/20 shadow-2xl">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4">
                <div class="bg-gradient-to-br from-amber-400 to-amber-600 p-2.5 rounded-2xl shadow-lg shadow-amber-500/20">
                    <svg class="w-7 h-7 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider gold-gradient-text uppercase">FPO Knowledge Sharing</h1>
                    <p class="text-[11px] text-slate-400 font-light tracking-widest">คลังปัญญาและ e-Book สถาบันการคลัง</p>
                </div>
            </div>
            
            <div class="w-full md:w-96 relative">
                <input type="text" id="searchInput" onkeyup="filterBooks()" placeholder="ค้นหาชื่อหนังสือ, ผู้แต่ง, หรือเนื้อหารีวิว..." 
                       class="w-full pl-11 pr-4 py-2.5 rounded-full bg-slate-900/80 border border-amber-500/30 text-white placeholder-slate-400 text-xs focus:outline-none focus:ring-2 focus:ring-amber-400/50 shadow-inner transition-all">
                <svg class="w-4 h-4 text-amber-400 absolute left-4 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full space-y-6">
        
        <div class="bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200/80 space-y-4">
            
            <div class="flex flex-wrap gap-2 items-center justify-between pb-4 border-b border-slate-100">
                <div class="flex flex-wrap gap-2 items-center" id="typeButtonsContainer">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-2">ประเภท:</span>
                    <button onclick="setFilter('type', 'all')" class="type-btn px-4 py-2 text-xs rounded-xl font-semibold shadow-md shadow-amber-500/10 gold-gradient-bg text-slate-950 transition-all">ทั้งหมด</button>
                    </div>
                
                <button onclick="resetFilters()" class="text-xs text-amber-600 hover:text-amber-700 font-semibold flex items-center gap-1 transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    ล้างค่าการค้นหา
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pt-1">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">หมวดหมู่เนื้อหา</label>
                    <select id="categorySelect" onchange="filterBooks()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-xs font-medium rounded-xl p-2.5 focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all">
                        <option value="all">ทุกหมวดหมู่</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">ปีที่เผยแพร่</label>
                    <select id="yearSelect" onchange="filterBooks()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-xs font-medium rounded-xl p-2.5 focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all">
                        <option value="all">ทุกปีที่เผยแพร่</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">การเรียงลำดับ</label>
                    <select id="sortSelect" onchange="filterBooks()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-xs font-medium rounded-xl p-2.5 focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all">
                        <option value="newest">รายการล่าสุด</option>
                        <option value="title_asc">ชื่อหนังสือ (A - Z / ก - ฮ)</option>
                        <option value="title_desc">ชื่อหนังสือ (Z - A / ฮ - ก)</option>
                    </select>
                </div>

                <div class="flex items-end pb-1">
                    <label class="relative flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="reviewOnlyCheckbox" onchange="filterBooks()" class="w-4 h-4 rounded text-amber-600 focus:ring-amber-500 border-slate-300">
                        <span class="text-xs font-medium text-slate-700">แสดงเฉพาะที่มีบทความรีวิว</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center px-2">
            <span class="text-xs text-slate-500 font-medium">พบผลลัพธ์ทั้งหมด <strong id="resultCount" class="text-amber-600 font-bold">0</strong> รายการ</span>
        </div>

        <div id="booksGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <div class="col-span-full text-center py-20 text-slate-400 font-light flex flex-col items-center gap-3">
                <svg class="animate-spin h-8 w-8 text-amber-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>กำลังโหลดข้อมูลหนังสือ...</span>
            </div>
        </div>

    </main>

    <div id="reviewModal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-md hidden z-50 flex items-center justify-center p-4 transition-opacity">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] overflow-y-auto p-8 relative shadow-2xl border border-amber-500/20">
            <button onclick="closeModal()" class="absolute top-5 right-5 text-slate-400 hover:text-slate-800 p-2 rounded-full hover:bg-slate-100 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div class="mb-3">
                <span id="modalCategory" class="text-[10px] font-bold tracking-widest uppercase text-amber-600 bg-amber-50 border border-amber-200/60 px-3 py-1 rounded-full"></span>
            </div>
            <h2 id="modalTitle" class="text-xl font-bold text-slate-900 leading-tight"></h2>
            <p id="modalAuthor" class="text-xs text-slate-400 font-light mt-1 mb-6"></p>
            <div class="h-px bg-gradient-to-r from-transparent via-slate-200 to-transparent mb-6"></div>
            <div id="modalContent" class="text-sm text-slate-600 leading-relaxed whitespace-pre-line mb-8 font-light"></div>
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                <button onclick="closeModal()" class="px-5 py-2.5 text-xs font-semibold text-slate-500 hover:bg-slate-100 rounded-xl transition-all">ปิดหน้าต่าง</button>
                <a id="modalSourceBtn" href="#" target="_blank" class="px-5 py-2.5 text-xs gold-gradient-bg text-slate-950 font-bold rounded-xl shadow-lg shadow-amber-500/20 hover:opacity-95 inline-flex items-center gap-2 transition-all">
                    อ่านเล่มฉบับเต็ม
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        // 📌 อย่าลืมใส่ URL Google Sheets CSV ของคุณตรงนี้
        const GOOGLE_SHEETS_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTpEHhBbCjLcAAEV1WRsuesUK3JJabw5FHf_X08nY4lWV7Gxi8yuQfdjngr7LvOkO9lPVVVcxkvJOz4/pubhtml';

        let booksData = [];
        let currentType = 'all';

        function fetchBooksFromGoogleSheets() {
            if (GOOGLE_SHEETS_CSV_URL === 'YOUR_GOOGLE_SHEETS_CSV_URL_HERE') {
                console.warn("ยังไม่ได้ใส่ URL Google Sheets CSV ใช้ Mock Data ชั่วคราว");
                booksData = [
                    { id: "1", title: "รายงานภาวะเศรษฐกิจการคลัง 2026", author: "สศค.", type: "รายงาน", category: "เศรษฐศาสตร์", year: "2026", cover_url: "https://images.unsplash.com/photo-1554415707-6e8cfc93fe23?auto=format&fit=crop&w=400&q=80", source_url: "#", review: "สรุปภาพรวมเศรษฐกิจ" },
                    { id: "2", title: "AI in Public Finance", author: "Tech Lab", type: "งานวิจัย", category: "เทคโนโลยี", year: "2025", cover_url: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=400&q=80", source_url: "#", review: "" }
                ];
                setupDynamicFilters();
                filterBooks();
                return;
            }

            Papa.parse(GOOGLE_SHEETS_CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    booksData = results.data.filter(b => b.title && b.title.trim() !== '');
                    setupDynamicFilters(); // สร้างตัวเลือกกรองอัตโนมัติตามข้อมูลจริง
                    filterBooks();
                },
                error: function(err) {
                    console.error("เกิดข้อผิดพลาดในการโหลดข้อมูล:", err);
                }
            });
        }

        // ฟังก์ชันสร้างตัวเลือก (ประเภท, หมวดหมู่, ปี) อัตโนมัติจากข้อมูลใน Sheets
        function setupDynamicFilters() {
            // 1. ดึงประเภท (Types) ที่ไม่ซ้ำกัน
            const types = [...new Set(booksData.map(b => b.type).filter(Boolean))];
            const typeContainer = document.getElementById('typeButtonsContainer');
            typeContainer.innerHTML = `<span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-2">ประเภท:</span>
                <button onclick="setFilter('type', 'all')" class="type-btn px-4 py-2 text-xs rounded-xl font-semibold shadow-md shadow-amber-500/10 gold-gradient-bg text-slate-950 transition-all">ทั้งหมด</button>`;
            
            types.forEach(type => {
                const btn = document.createElement('button');
                btn.onclick = () => setFilter('type', type);
                btn.className = 'type-btn px-4 py-2 text-xs rounded-xl font-medium bg-slate-100 text-slate-600 hover:bg-slate-200/80 transition-all';
                btn.textContent = type;
                typeContainer.appendChild(btn);
            });

            // 2. ดึงหมวดหมู่ (Categories) ที่ไม่ซ้ำกัน
            const categories = [...new Set(booksData.map(b => b.category).filter(Boolean))].sort();
            const catSelect = document.getElementById('categorySelect');
            catSelect.innerHTML = '<option value="all">ทุกหมวดหมู่</option>';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                catSelect.appendChild(opt);
            });

            // 3. ดึงปี (Years) ที่ไม่ซ้ำกัน และเรียงจากปีใหม่ไปปีเก่า
            const years = [...new Set(booksData.map(b => b.year).filter(Boolean))].sort((a, b) => b - a);
            const yearSelect = document.getElementById('yearSelect');
            yearSelect.innerHTML = '<option value="all">ทุกปีที่เผยแพร่</option>';
            years.forEach(year => {
                const opt = document.createElement('option');
                opt.value = year;
                // คำนวณแปลงปี ค.ศ. เป็น พ.ศ. แสดงผลคู่กัน
                const thYear = !isNaN(year) ? ` (พ.ศ. ${parseInt(year) + 543})` : '';
                opt.textContent = year + thYear;
                yearSelect.appendChild(opt);
            });
        }

        function renderBooks(data) {
            const grid = document.getElementById('booksGrid');
            document.getElementById('resultCount').textContent = data.length;
            grid.innerHTML = '';

            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 font-light">ไม่พบข้อมูลหนังสือตามเงื่อนไขที่กำหนด</div>`;
                return;
            }

            data.forEach(book => {
                const hasReview = book.review && book.review.trim() !== '';
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-lg shadow-slate-200/50 border border-slate-100 overflow-hidden flex flex-col hover:-translate-y-1.5 hover:shadow-2xl hover:shadow-amber-500/10 transition-all duration-300 group";
                
                card.innerHTML = `
                    <div class="relative aspect-[3/4] bg-slate-900 overflow-hidden">
                        <img src="${book.cover_url || 'https://via.placeholder.com/400x533?text=No+Cover'}" alt="${book.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 opacity-95 group-hover:opacity-100">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                        <span class="absolute top-3 left-3 bg-slate-950/80 backdrop-blur-md text-amber-400 border border-amber-400/30 text-[9px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-lg">
                            ${book.type || 'ทั่วไป'}
                        </span>
                        <span class="absolute top-3 right-3 bg-slate-900/70 backdrop-blur-md text-slate-300 text-[9px] font-medium px-2 py-0.5 rounded-md">
                            ${book.year || ''}
                        </span>
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <span class="text-[10px] font-bold tracking-wider uppercase text-amber-600 mb-1.5">${book.category || 'ทั่วไป'}</span>
                        <h3 class="font-bold text-slate-800 text-sm line-clamp-2 leading-snug mb-1 group-hover:text-amber-600 transition-colors" title="${book.title}">${book.title}</h3>
                        <p class="text-[11px] text-slate-400 font-light mb-4 line-clamp-1">${book.author || 'ไม่ระบุผู้แต่ง'}</p>
                        
                        <div class="mt-auto flex flex-col gap-2">
                            ${hasReview ? `
                                <button onclick="openReview('${book.id}')" class="w-full py-2 px-3 text-xs bg-slate-50 hover:bg-amber-50 text-slate-700 hover:text-amber-700 font-medium rounded-xl border border-slate-200/60 hover:border-amber-200 text-center transition-all">
                                    อ่านบทความรีวิว
                                </button>
                            ` : ''}
                            <a href="${book.source_url || '#'}" target="_blank" class="w-full py-2 px-3 text-xs bg-slate-900 hover:bg-slate-950 text-white font-medium rounded-xl text-center flex items-center justify-center gap-1.5 shadow-md shadow-slate-950/10 transition-all">
                                ลิงก์ต้นฉบับ
                                <svg class="w-3 h-3 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                            </a>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterBooks() {
            const searchText = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedCategory = document.getElementById('categorySelect').value;
            const selectedYear = document.getElementById('yearSelect').value;
            const selectedSort = document.getElementById('sortSelect').value;
            const reviewOnly = document.getElementById('reviewOnlyCheckbox').checked;

            let filtered = booksData.filter(book => {
                const matchesSearch = !searchText || 
                                      (book.title && book.title.toLowerCase().includes(searchText)) || 
                                      (book.author && book.author.toLowerCase().includes(searchText)) ||
                                      (book.review && book.review.toLowerCase().includes(searchText));
                
                const matchesType = currentType === 'all' || book.type === currentType;
                const matchesCategory = selectedCategory === 'all' || book.category === selectedCategory;
                const matchesYear = selectedYear === 'all' || String(book.year) === String(selectedYear);
                const matchesReview = !reviewOnly || (book.review && book.review.trim() !== '');

                return matchesSearch && matchesType && matchesCategory && matchesYear && matchesReview;
            });

            if (selectedSort === 'title_asc') {
                filtered.sort((a, b) => (a.title || '').localeCompare(b.title || '', 'th'));
            } else if (selectedSort === 'title_desc') {
                filtered.sort((a, b) => (b.title || '').localeCompare(a.title || '', 'th'));
            } else {
                filtered.sort((a, b) => String(b.year || '').localeCompare(String(a.year || '')));
            }

            renderBooks(filtered);
        }

        function setFilter(filterType, value) {
            if (filterType === 'type') {
                currentType = value;
                document.querySelectorAll('.type-btn').forEach(btn => {
                    const text = btn.textContent.trim();
                    if ((value === 'all' && text === 'ทั้งหมด') || text === value) {
                        btn.className = 'type-btn px-4 py-2 text-xs rounded-xl font-semibold shadow-md shadow-amber-500/10 gold-gradient-bg text-slate-950 transition-all';
                    } else {
                        btn.className = 'type-btn px-4 py-2 text-xs rounded-xl font-medium bg-slate-100 text-slate-600 hover:bg-slate-200/80 transition-all';
                    }
                });
            }
            filterBooks();
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categorySelect').value = 'all';
            document.getElementById('yearSelect').value = 'all';
            document.getElementById('sortSelect').value = 'newest';
            document.getElementById('reviewOnlyCheckbox').checked = false;
            setFilter('type', 'all');
        }

        function openReview(id) {
            const book = booksData.find(b => String(b.id) === String(id));
            if (!book) return;

            const yearStr = book.year ? ` (ปี พ.ศ. ${!isNaN(book.year) ? parseInt(book.year) + 543 : book.year})` : '';
            document.getElementById('modalTitle').textContent = book.title;
            document.getElementById('modalAuthor').textContent = "จัดทำโดย: " + (book.author || 'ไม่ระบุ') + yearStr;
            document.getElementById('modalCategory').textContent = (book.category || 'ทั่วไป') + " • " + (book.type || 'ทั่วไป');
            document.getElementById('modalContent').textContent = book.review;
            document.getElementById('modalSourceBtn').href = book.source_url || '#';
            
            document.getElementById('reviewModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('reviewModal').classList.add('hidden');
        }

        fetchBooksFromGoogleSheets();
    </script>
</body>
</html>
