<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPO Knowledge Sharing | ศูนย์รวม e-Book ฟรี</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            300: '#fde047',
                            400: '#eab308',
                            500: '#ca8a04',
                            600: '#a16207',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
        }
        .gold-gradient-text {
            background: linear-gradient(135deg, #fef08a 0%, #eab308 50%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gold-gradient-bg {
            background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
        }
        .glass-header {
            background: rgba(3, 7, 18, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <header class="glass-header text-white sticky top-0 z-50 border-b border-amber-500/20 shadow-2xl">
        <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center space-x-4">
                <div class="bg-gradient-to-br from-amber-400 to-amber-600 p-2.5 rounded-2xl shadow-lg shadow-amber-500/20">
                    <svg class="w-7 h-7 text-slate-950" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wider gold-gradient-text uppercase">FPO Knowledge Sharing</h1>
                    <p class="text-[11px] text-slate-400 font-light tracking-widest">คลังปัญญาและ e-Book สถาบันการคลัง</p>
                </div>
            </div>
            
            <div class="w-full md:w-96 relative">
                <input type="text" id="searchInput" onkeyup="filterBooks()" placeholder="ค้นหาชื่อหนังสือ, ผู้แต่ง, หรือเนื้อหารีวิว..." 
                       class="w-full pl-11 pr-4 py-2.5 rounded-full bg-slate-900/80 border border-amber-500/30 text-white placeholder-slate-400 text-xs focus:outline-none focus:ring-2 focus:ring-amber-400/50 shadow-inner transition-all">
                <svg class="w-4 h-4 text-amber-400 absolute left-4 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-8 flex-grow w-full space-y-6">
        
        <div class="bg-white/90 backdrop-blur-md p-6 rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-200/80 space-y-4">
            
            <div class="flex flex-wrap gap-2 items-center justify-between pb-4 border-b border-slate-100">
                <div class="flex flex-wrap gap-2 items-center" id="typeButtonsContainer">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mr-2">ประเภท:</span>
                    <button onclick="setFilter('type', 'all')" class="type-btn px-4 py-2 text-xs rounded-xl font-semibold shadow-md shadow-amber-500/10 gold-gradient-bg text-slate-950 transition-all">ทั้งหมด</button>
                    </div>
                
                <button onclick="resetFilters()" class="text-xs text-amber-600 hover:text-amber-700 font-semibold flex items-center gap-1 transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    ล้างค่าการค้นหา
                </button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 pt-1">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">หมวดหมู่เนื้อหา</label>
                    <select id="categorySelect" onchange="filterBooks()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-xs font-medium rounded-xl p-2.5 focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all">
                        <option value="all">ทุกหมวดหมู่</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">ปีที่เผยแพร่</label>
                    <select id="yearSelect" onchange="filterBooks()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-xs font-medium rounded-xl p-2.5 focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all">
                        <option value="all">ทุกปีที่เผยแพร่</option>
                    </select>
                </div>

                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-1.5">การเรียงลำดับ</label>
                    <select id="sortSelect" onchange="filterBooks()" class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-xs font-medium rounded-xl p-2.5 focus:ring-2 focus:ring-amber-500/20 focus:border-amber-500 outline-none transition-all">
                        <option value="newest">รายการล่าสุด</option>
                        <option value="title_asc">ชื่อหนังสือ (A - Z / ก - ฮ)</option>
                        <option value="title_desc">ชื่อหนังสือ (Z - A / ฮ - ก)</option>
                    </select>
                </div>

                <div class="flex items-end pb-1">
                    <label class="relative flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="reviewOnlyCheckbox" onchange="filterBooks()" class="w-4 h-4 rounded text-amber-600 focus:ring-amber-500 border-slate-300">
                        <span class="text-xs font-medium text-slate-700">แสดงเฉพาะที่มีบทความรีวิว</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="flex justify-between items-center px-2">
            <span class="text-xs text-slate-500 font-medium">พบผลลัพธ์ทั้งหมด <strong id="resultCount" class="text-amber-600 font-bold">0</strong> รายการ</span>
        </div>

        <div id="booksGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <div class="col-span-full text-center py-20 text-slate-400 font-light flex flex-col items-center gap-3">
                <svg class="animate-spin h-8 w-8 text-amber-500" xmlns="http://www.w3.org/2000/svg" fill="
